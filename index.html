<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name ='viewport'
    content='width=device-width,
    initial-scale=1.0'>
    <title>67-Blocks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Шапка -->
        <header id = "header">
        <div class = 'header-left'>
            <span class = 'logo'>67-Blocks</span>
        </div>
        <div class = 'header-right'>
            <button id="Start-btn" class="header-btn Start-btn">Start</button>
            <button id="Save-btn" class="header-btn Save-btn">Save</button>
            <button id="Reset-btn" class="header-btn Reset-btn">Reset</button>
        </div>
    </header>

<div id = 'workspace'>
                <!-- Левая часть политра -->
                <div id = "palette">
        <h2>Палитра</h2>

        <div class="block-var" draggable = "true">
            <span class="delete-btn">&times;</span> var
            <br>
            <label for="type-input">type</label><select class="type-input" name = "type">
                <option value="int">int</option>
                <option value="string">string</option>
                <option value="bool">bool</option>
            </select>

            <label for="name-input">name </label><input class="name-input" type="text">
        </div>

        <div class="block-assign" draggable = "true">
            <span class="delete-btn">&times;</span> assign
            <label for="var-input">var</label><select class="var-input" name = "var-input">
                <option value="test1">test1</option>
                <option value="test2">test2</option>
                <option value="test3">test3</option>
            </select>
                                    <label> = </label>
            <input class="expr-input" type = "text">
                                </div>

        <div class="block-print-var" draggable="true">
            <span class="delete-btn">&times;</span> print
            <label for="var-input">var</label><select class="var-input" name = "var-input">
                <option value="test1">test1</option>
                <option value="test2">test2</option>
                <option value="test3">test3</option>
            </select>
        </div>

        <div class ="block-while" draggable = "true">
            <span class="delete-btn">&times;</span>
            <div class="block-header">While: </div><input class="expr-input" type="text">

            <div class="inner-slot">do</div>
        </div>
        <div class="block-container" draggable = "true">
            <span class="delete-btn">&times;</span>
            <div class="block-header">Container:</div>
            <div class="inner-slot"></div>
        </div>

    </div>

    <!-- Центральная часть-->
            <div id="canvas"></div>

    <!-- Правая часть-->
            <div id = "console">
        <div class="console-header">
            <h2>Консоль</h2>
            <button id="btn-clear-console" class="console-clear-btn">Clear</button>
            </div>
        <div id="console-output"></div>
    </div>
</div>
    <script type="module" src="script.js"></script>
</body>
</html>
