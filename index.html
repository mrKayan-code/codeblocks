<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>67-Blocks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>67-Blocks</h1>

    <div id="palette">
        <h2>Палитра</h2>

        <div class="block-var" draggable="true"> var
            <br>
            <label for="type-input">type</label><select class="type-input" name = "type">
                <option value="int">int</option>
                <option value="string">string</option>
                <option value="bool">bool</option>
            </select>

            <label for="name-input">name </label><input class="name-input" type="text">
        </div>

        <div class="block-assign" draggable="true">assign
            <label for="var-input">var</label><select class="var-input" name = "var-input">
                <option value="test1">test1</option>
                <option value="test2">test2</option>
                <option value="test3">test3</option>
            </select>
            <!-- <div class="inp-block-left"></div> -->
            <label> = </label>
            <input class="expr-input" type="text">
            <!-- <div class="inp-block-right"></div> -->
        </div>

        <div class="block-print-var" draggable="true">print
            <label for="var-input">var</label><select class="var-input" name = "var-input">
                <option value="test1">test1</option>
                <option value="test2">test2</option>
                <option value="test3">test3</option>
            </select>
        </div>

        <div class="block-container" draggable="true">
            <div class="block-header">While:</div>
            <div class="inner-slot"></div>
        </div>

    </div>

    <div id="startblock">Start</div>

    <div id="canvas"></div>

<!-- <script>
    document.getElementById('startblock').onclick = function() {
        alert('Пока нету блоков команд');
    };
</script> -->

    <script src="script.js"></script>
    <script src="interpretator.js"></script>
</body>
</html>
